# Single public entry point on :80 for both services on this VM, routing
# by Host header -- Cloudflare's Flexible SSL mode (this VM has no TLS
# cert of its own) always talks to the origin on port 80 for a normal
# https://<domain> visit, and only one process can bind that port. The
# Hub (Flask/gunicorn) and the MCP server (uvicorn/ASGI) each bind their
# own internal-only port instead (127.0.0.1:8000 and 127.0.0.1:5301) --
# see job-radar-hub.service / job-radar-hub-mcp.service.
#
# Installed by deploy/gce-startup-script.sh to /etc/nginx/sites-available/
# job-radar (symlinked into sites-enabled/).

# Required security headers from specification.website/spec/security/ --
# job-radar-site gets these from Cloudflare Pages' own _headers file, but
# Cloudflare doesn't add them for a plain proxied origin like this one, so
# they have to be set here instead (repeated per server block, add_header
# isn't inherited across server blocks in nginx).

server {
    listen 80;
    server_name hub.12getajob.com;

    # Flexible SSL means nginx only ever sees plain HTTP from Cloudflare,
    # even for a visitor who connected over HTTPS -- X-Forwarded-Proto is
    # the one place that original scheme survives, so it's what a redirect
    # has to key off instead of $scheme (which is always "http" here and
    # would otherwise loop).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # The only HTML this origin serves is GET/POST /alerts (a plain form,
    # no <script> at all) -- script-src 'none' is safe. style-src needs
    # 'unsafe-inline': alerts.py's template has both a <style> block and a
    # couple of inline style="" attributes, and a hash only covers <style>
    # elements, not attributes -- same style-src trade-off as
    # job-radar-site's _headers, made for the same reason.
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: https://github.com/woskam/job-radar-hub/issues\nContact: https://github.com/woskam/job-radar-site/issues\nExpires: 2027-09-30T00:00:00Z\nPreferred-Languages: en, nl\nCanonical: https://hub.12getajob.com/.well-known/security.txt\n";
    }

    # nginx's default (1m) silently 413'd every POST /ingest once the
    # payload grew past it -- job-radar's full open-listings push is
    # ~62MB today. Discovered because scheduler.py's push_to_hub() never
    # checked the response status, so months of failed pushes left the
    # Hub stuck on a stale, much smaller dataset with no error anywhere.
    # 100m leaves real headroom for further growth.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name mcp.12getajob.com;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # This origin serves no HTML at all (MCP's Streamable HTTP transport is
    # JSON-RPC over POST) -- as strict as CSP gets, kept mainly so a direct
    # browser visit doesn't get a blank policy.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: https://github.com/woskam/job-radar-hub/issues\nContact: https://github.com/woskam/job-radar-site/issues\nExpires: 2027-09-30T00:00:00Z\nPreferred-Languages: en, nl\nCanonical: https://mcp.12getajob.com/.well-known/security.txt\n";
    }

    location / {
        proxy_pass http://127.0.0.1:5301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # MCP's Streamable HTTP transport is a long-lived, streamed
        # connection (SSE-like) -- buffering would break it, and the
        # default read timeout is too short for a connection that's
        # meant to stay open.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
